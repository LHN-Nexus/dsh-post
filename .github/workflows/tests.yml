name: Offline Python checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Built-in self-test
        run: python -m bridge.post --self-test
      - name: Delivery and receive regression
        run: python tests/test_post.py
      - name: Chat regression
        run: python tests/test_chat.py
      - name: Transfer interruption and recovery
        run: python tests/test_recovery.py
      - name: Minimal local example
        run: python examples/minimal/setup.py
